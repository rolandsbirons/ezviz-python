[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ezviz-python"
version = "0.1.0"
description = "Clean async Python library for EZVIZ cameras"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Rolands Birons" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
ezviz = "ezviz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ezviz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
